version: 2
registries:
  dhi:
    type: docker-registry
    url: https://dhi.io
    # Dependabot kan ikke lese vars, så brukernavnet må også ligge som Dependabot-secret
    username: ${{ secrets.DOCKERHUB_USERNAME }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}
updates:
  - package-ecosystem: "bun"
    directory: "/auth-proxy"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    directories:
      - "/app"
      - "/auth-proxy"
    registries:
      - dhi
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "dhi.io/eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "geoserver"
        versions:
          - "3.1.x" # Blocks nightly tags; Update this when upgrading GeoServer
          - "4.0.x" # Blocks nightly tags; Update this when upgrading GeoServer
