# Version catalog is a central place for you to declare and version dependencies
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
# Must match the Log4j version bundled in the pinned GeoServer base image.
log4j = "2.26.1"

[libraries]
gt-jdbc = { module = "org.geotools.jdbc:gt-jdbc-oracle", version = "35.1" }
matrikkel-geotools-jdbc = { module = 'org.geotools:matrikkel-geotools-jdbc',  version = '35.1.0.2026.09.07-12.05-d7e1057' }
ojdbc17 = { module = "com.oracle.database.jdbc:ojdbc17", version = "23.26.3.0.0"}

log4j-layout = { module = "org.apache.logging.log4j:log4j-layout-template-json", version.ref = "log4j" }
